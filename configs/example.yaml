# One YAML per run. `seed` is mandatory.
# This file doubles as the schema reference. 
run_name: example
seed: 20260901

dataset:
  name: synthetic_factor_panel   
  correlation: 0.4

method: lds                      # any key of dire.methods.registry.METHODS

model:
  hidden_layers: [64, 64]

training:
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
